# The Automancer fork's pull request check. The workflows inherited from
# upstream are disabled on this repository (they retarget pull requests to
# upstream's dev branch, publish upstream's releases and enforce upstream's
# contributor rules), so this is the fork's only CI.
# The whole suite does not fit the five-minute budget on a hosted runner, so a
# pull request builds the server and tests the Go packages it changes, plus the
# hub packages (auth conductor and management handlers) on every run, because a
# change elsewhere can break them without touching their files.
name: estate-ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -o /tmp/cli-proxy-api ./cmd/server
      - name: Vet and test changed and hub packages
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          HUB_PKGS: ./sdk/cliproxy/auth ./internal/api/handlers/management
        run: |
          # Intersect changed directories with packages owned by the root module.
          # Upstream also changes nested example modules and testdata fixtures;
          # passing those paths to root-module go vet/test fails before checks run.
          go list -f '{{.Dir}}' ./... | sort -u > "$RUNNER_TEMP/root-go-package-dirs"
          pkgs=$( { git diff --name-only "$BASE_REF"...HEAD -- '*.go' | xargs -r -n1 dirname |
            while read -r dir; do [ -d "$dir" ] && realpath "$dir"; done;
            for pkg in $HUB_PKGS; do realpath "$pkg"; done; } | sort -u |
            comm -12 - "$RUNNER_TEMP/root-go-package-dirs" | sed "s|^$PWD/|./|")
          echo "$pkgs"
          go vet $pkgs
          go test -count=1 $pkgs
